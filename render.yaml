services:
  - type: web
    name: jobber-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=@jobber/api
    startCommand: npm run start --workspace=@jobber/api
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: jobber
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        sync: false
      - key: MONGODB_CONNECT_TIMEOUT_MS
        value: 5000
      - key: SHUTDOWN_GRACE_MS
        value: 10000
