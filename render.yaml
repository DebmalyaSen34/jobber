services:
  - type: web
    name: jobber-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace=@jobber/api
    startCommand: npm run start --workspace=@jobber/api
    healthCheckPath: /health/ready
    # maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: jobber-cluster
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: 168
      - key: BCRYPT_ROUNDS
        value: 12
      - key: LOGIN_WINDOW_MINUTES
        value: 15
      - key: LOGIN_EMAIL_LIMIT
        value: 5
      - key: LOGIN_IP_LIMIT
        value: 20
      - key: JOB_LEASE_SECONDS
        value: 60
      - key: JOB_POLL_MS
        value: 1000
      - key: JOB_MAX_ATTEMPTS
        value: 3
      - key: JOB_RETRY_BASE_MS
        value: 5000
      - key: PIPELINE_VERSION
        value: "1"
      - key: WEB_ORIGINS
        sync: false
      - key: MONGODB_CONNECT_TIMEOUT_MS
        value: 5000
      - key: SHUTDOWN_GRACE_MS
        value: 10000
